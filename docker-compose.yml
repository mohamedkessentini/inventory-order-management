services:
  mongo:
    image: mongo:7
    container_name: inventory-mongo
    ports:
      - "${MONGO_PORT:-27019}:27017"
    volumes:
      - inventory-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: inventory-server
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4100
      MONGO_URI: mongodb://mongo:27017/inventory_management
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8091}
    ports:
      - "${API_PORT:-4100}:4100"

  client:
    build:
      context: ./client
      args:
        API_URL: ${API_URL:-http://localhost:4100/api}
    container_name: inventory-client
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-8091}:80"

volumes:
  inventory-mongo-data:
