server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular Router: let the app handle client-side routes instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
